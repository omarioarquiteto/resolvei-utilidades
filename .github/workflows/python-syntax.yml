name: Validate Python source

on:
  push:
    branches: [main, feature/vibe-lucro-iqoption]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies for Consultor Sênior tests
        run: python -m pip install --upgrade pip fastapi pydantic requests
      - name: Compile Python files
        run: python -m compileall -q server.py monitor_precos_api.py monitor_precos_cron.py guru_sinais_api.py guru_sinais_iqoption_api.py consultor_senior_api.py consultor_senior_auth.py consultor_senior_prompt.py binary_analysis vibe_lucro_api.py vibe_lucro_auth.py vibe_lucro_engine.py integrations/vibe-trading/vibe_lucro_routes.py
      - name: Run Consultor Sênior signal tests
        run: python -m unittest discover -s tests -p "test_consultor_senior_api.py" -v
      - name: Run VIBE LUCRO quantitative engine tests
        run: python -m unittest discover -s tests -p "test_vibe_lucro_engine.py" -v
      - name: Run VIBE LUCRO exclusive-session tests
        run: python -m unittest discover -s tests -p "test_vibe_lucro_auth.py" -v
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Consultor Sênior frontend syntax
        run: |
          node --check consultor-senior.js
          node --check vibe-lucro.js
