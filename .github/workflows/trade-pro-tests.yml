name: IQ Option analysis tests

on:
  push:
    branches:
      - feature/trade-pro
      - feature/altos-lucros-digital-targets
    paths:
      - "trade_pro_*.py"
      - "trade-pro.js"
      - "altos_lucros_*.py"
      - "altos-lucros.js"
      - "tests/test_trade_pro_engine.py"
      - "tests/test_altos_lucros_engine.py"
      - ".github/workflows/trade-pro-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "trade_pro_*.py"
      - "trade-pro.js"
      - "altos_lucros_*.py"
      - "altos-lucros.js"
      - "tests/test_trade_pro_engine.py"
      - "tests/test_altos_lucros_engine.py"
      - ".github/workflows/trade-pro-tests.yml"

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip fastapi pydantic numpy "pandas>=2,<3" "git+https://github.com/victalejo/iqoptionapi.git@acac6e08333466ae188c7dfa7fd2a03174e34ca2"
      - name: Compile IQ Option analysis modules
        run: python -m compileall -q trade_pro_auth.py trade_pro_api.py trade_pro_engine.py altos_lucros_api.py altos_lucros_engine.py altos_lucros_marketdata.py
      - name: Run TRADE-PRÓ deterministic tests
        run: python -m unittest discover -s tests -p "test_trade_pro_engine.py" -v
      - name: Run ALTOS LUCROS deterministic backtests
        run: |
          python -m unittest discover -s tests -p "test_altos_lucros_engine.py" -v
          python -m unittest discover -s tests -p "test_altos_lucros_marketdata.py" -v
          python -m unittest discover -s tests -p "test_altos_lucros_api.py" -v
          python -m unittest discover -s tests -p "test_altos_lucros_catalog.py" -v
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend JavaScript syntax
        run: |
          node --check trade-pro.js
          node --check altos-lucros.js
