name: Trade Pro smoke tests

on:
  push:
    branches: [feature/trade-pro]
    paths:
      - "trade_pro_*.py"
      - "trade-pro.js"
      - "tests/test_trade_pro_engine.py"
      - ".github/workflows/trade-pro-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "trade_pro_*.py"
      - "trade-pro.js"
      - "tests/test_trade_pro_engine.py"
      - ".github/workflows/trade-pro-tests.yml"

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip numpy "pandas>=2,<3"
      - name: Compile new Python modules
        run: python -m compileall -q trade_pro_auth.py trade_pro_api.py trade_pro_engine.py
      - name: Run deterministic engine tests
        run: python -m unittest discover -s tests -p "test_trade_pro_engine.py" -v
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend JavaScript syntax
        run: node --check trade-pro.js
