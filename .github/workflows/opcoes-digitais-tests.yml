name: Opções Digitais deterministic tests

on:
  push:
    branches: [main]
    paths:
      - "opcoes_digitais_*.py"
      - "opcoes-digitais.js"
      - "opcoes-digitais.css"
      - "tests/test_opcoes_digitais_engine.py"
      - ".github/workflows/opcoes-digitais-tests.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip numpy "pandas>=2,<3" fastapi pydantic
      - name: Compile Opções Digitais modules
        run: python -m compileall -q opcoes_digitais_engine.py opcoes_digitais_api.py opcoes_digitais_auth.py
      - name: Run deterministic engine tests
        run: python -m unittest discover -s tests -p "test_opcoes_digitais_engine.py" -v
      - name: Check frontend JavaScript syntax
        run: node --check opcoes-digitais.js
