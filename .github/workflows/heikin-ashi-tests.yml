name: Heikin-Ashi Digital tests

on:
  push:
    branches: [main]
    paths:
      - "heikin_ashi_*.py"
      - "heikin-ashi.js"
      - "heikin-ashi.css"
      - "tests/test_heikin_ashi_engine.py"
      - ".github/workflows/heikin-ashi-tests.yml"
      - "app.js"
      - "server.py"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip numpy "pandas>=2,<3" fastapi pydantic
      - name: Compile Heikin-Ashi modules
        run: python -m compileall -q heikin_ashi_engine.py heikin_ashi_api.py heikin_ashi_auth.py
      - name: Run deterministic engine tests
        run: python -m unittest discover -s tests -p "test_heikin_ashi_engine.py" -v
      - name: Check frontend JavaScript syntax
        run: node --check heikin-ashi.js
