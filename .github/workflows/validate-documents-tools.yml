name: Validate document tools
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate Python syntax
        run: python -m py_compile server.py documents_api.py
      - name: Validate JavaScript syntax
        run: node --check app.js && node --check documents-tools.js
