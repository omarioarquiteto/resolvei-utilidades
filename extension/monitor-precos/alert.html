<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resolvei — Alerta de preço</title>
  <link rel="stylesheet" href="alert.css">
</head>
<body>
  <main class="alert-shell">
    <header class="brand-row">
      <span class="brand-mark">R</span>
      <div><strong>Resolvei</strong><small>Monitor de Preços</small></div>
    </header>
    <section class="intro">
      <div class="success-icon">✓</div>
      <p class="eyebrow">ALERTA DE PREÇO</p>
      <h1>Sua meta foi atingida</h1>
      <p>Encontramos um preço igual ou inferior ao valor que você definiu.</p>
    </section>
    <div id="alert-products" class="alert-products">
      <div class="loading">Consultando os detalhes do produto…</div>
    </div>
    <footer>
      <a href="https://resolvei-utilidades.onrender.com/#/ferramenta/monitor-precos" target="_blank" rel="noopener">Abrir Monitor de Preços no Resolvei</a>
    </footer>
  </main>
  <script src="alert.js"></script>

</html>
