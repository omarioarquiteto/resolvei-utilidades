services:
  - type: web
    name: resolvei
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.21"
      - key: CORS_ORIGINS
        value: "https://resolvei.onrender.com,https://resolvei-utilidades.onrender.com,https://resolvei.com.br,https://www.resolvei.com.br"
